name: Free iOS App Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build iOS App Executable
        run: |
          mkdir -p build
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SWIFT_FILES=$(find . -name "*.swift" -not -path "*/.*")
          
          xcrun swiftc -target arm64-apple-ios16.0 \
                 -sdk "$SDK_PATH" \
                 -parse-as-library \
                 -framework SwiftUI \
                 -framework UIKit \
                 -framework Foundation \
                 -framework CoreGraphics \
                 -O \
                 -o build/FreeFireCompanion \
                 $SWIFT_FILES

      - name: Package Valid IPA for Diawi & Web Installers
        run: |
          rm -rf Payload FreeFireCompanion.ipa
          mkdir -p Payload/FreeFireCompanion.app
          
          cp build/FreeFireCompanion Payload/FreeFireCompanion.app/
          
          cat << 'EOF' > Payload/FreeFireCompanion.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>FreeFireCompanion</string>
              <key>CFBundleIdentifier</key>
              <string>com.freefire.companion</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>FF Companion</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          EOF

          # Convert Info.plist to Apple Binary Format for Diawi compatibility
          plutil -convert binary1 Payload/FreeFireCompanion.app/Info.plist

          zip -r FreeFireCompanion.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireCompanion-iOS-App
          path: FreeFireCompanion.ipa
