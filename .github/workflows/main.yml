name: EPZ GAME TURBO iOS Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-deploy-epz-turbo:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build EPZ GAME TURBO iOS Executable (Master Bundle)
        run: |
          mkdir -p build
          echo "Compiling ContentView.swift directly..."
          
          # Explicitly compile master ContentView.swift file
          xcrun swiftc -target arm64-apple-ios16.0 \
                 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
                 -parse-as-library \
                 -framework SwiftUI \
                 -framework UIKit \
                 -framework Foundation \
                 -framework CoreGraphics \
                 -framework QuartzCore \
                 -framework AudioToolbox \
                 -O \
                 -whole-module-optimization \
                 -Xlinker -dead_strip \
                 -o build/EPZGameTurbo \
                 ContentView.swift

      - name: Package Valid EPZ IPA
        run: |
          rm -rf Payload EPZGameTurbo.ipa
          mkdir -p Payload/EPZGameTurbo.app
          
          cp build/EPZGameTurbo Payload/EPZGameTurbo.app/
          
          plutil -create xml1 Payload/EPZGameTurbo.app/Info.plist
          plutil -insert CFBundleExecutable -string "EPZGameTurbo" Payload/EPZGameTurbo.app/Info.plist
          plutil -insert CFBundleIdentifier -string "com.epz.gameturbo" Payload/EPZGameTurbo.app/Info.plist
          plutil -insert CFBundleName -string "EPZ Turbo" Payload/EPZGameTurbo.app/Info.plist
          plutil -insert CFBundlePackageType -string "APPL" Payload/EPZGameTurbo.app/Info.plist
          plutil -insert CFBundleShortVersionString -string "1.0" Payload/EPZGameTurbo.app/Info.plist
          plutil -insert CFBundleVersion -string "1" Payload/EPZGameTurbo.app/Info.plist
          plutil -insert LSRequiresIPhoneOS -bool true Payload/EPZGameTurbo.app/Info.plist
          plutil -insert MinimumOSVersion -string "13.0" Payload/EPZGameTurbo.app/Info.plist

          # Allow HTTP Wispbyte Server Access (http://78.154.103.8:15429)
          plutil -insert NSAppTransportSecurity -xml "<dict><key>NSAllowsArbitraryLoads</key><true/></dict>" Payload/EPZGameTurbo.app/Info.plist

          # Free Fire URL Schemes
          plutil -insert LSApplicationQueriesSchemes -xml "<array><string>garenaff</string><string>freefire</string></array>" Payload/EPZGameTurbo.app/Info.plist

          plutil -convert binary1 Payload/EPZGameTurbo.app/Info.plist

          zip -9 -r EPZGameTurbo.ipa Payload
          ls -lh EPZGameTurbo.ipa

      - name: Upload IPA Build Artifact (Direct Download from Actions Summary)
        uses: actions/upload-artifact@v4
        with:
          name: EPZGameTurbo-iOS-App
          path: EPZGameTurbo.ipa

      - name: Create GitHub Release with EPZ IPA
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-v${{ github.run_number }}
          name: EPZ GAME TURBO PRO iOS v1.0.${{ github.run_number }}
          body: |
            ⚡ **EPZ GAME TURBO iOS — Production-Grade Gaming Tool & Floating HUD**
            
            - **Design & Theme**: Cyberpunk Dark Mode (#0A0A0A) & Electric Cyan (#00E5FF) accent styling.
            - **Wispbyte License API**: Connected to http://78.154.103.8:15429/validate with HWID vendor lock.
            - **Floating In-Game HUD**: Live RAM (mach_host_basic_info), Ping (1.1.1.1), and Thermal State monitor.
            - **In-Match Sensitivity Panel**: Tap Sensitivity, Swipe Responsiveness, Micro Control Accuracy (5-step levels: Lowest to Highest) with haptic toast notifications.
            - **Pro Dashboard**: 1-Tap RAM Memory Purger & Free Fire Quick Launch shortcut.
          files: |
            EPZGameTurbo.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
