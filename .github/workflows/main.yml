name: Free iOS 1-Click OTA Direct Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy-ota:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build iOS App Executable
        run: |
          mkdir -p build
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SWIFT_FILES=$(find . -name "*.swift" -not -path "*/.*")
          
          xcrun swiftc -target arm64-apple-ios16.0 \
                 -sdk "$SDK_PATH" \
                 -parse-as-library \
                 -framework SwiftUI \
                 -framework UIKit \
                 -framework Foundation \
                 -framework CoreGraphics \
                 -O \
                 -o build/FreeFireCompanion \
                 $SWIFT_FILES

      - name: Package Valid IPA
        run: |
          rm -rf Payload FreeFireCompanion.ipa
          mkdir -p Payload/FreeFireCompanion.app
          
          cp build/FreeFireCompanion Payload/FreeFireCompanion.app/
          
          plutil -create xml1 Payload/FreeFireCompanion.app/Info.plist
          plutil -insert CFBundleExecutable -string "FreeFireCompanion" Payload/FreeFireCompanion.app/Info.plist
          plutil -insert CFBundleIdentifier -string "com.freefire.companion" Payload/FreeFireCompanion.app/Info.plist
          plutil -insert CFBundleName -string "FF Companion" Payload/FreeFireCompanion.app/Info.plist
          plutil -insert CFBundlePackageType -string "APPL" Payload/FreeFireCompanion.app/Info.plist
          plutil -insert CFBundleShortVersionString -string "1.0" Payload/FreeFireCompanion.app/Info.plist
          plutil -insert CFBundleVersion -string "1" Payload/FreeFireCompanion.app/Info.plist
          plutil -insert LSRequiresIPhoneOS -bool true Payload/FreeFireCompanion.app/Info.plist
          plutil -insert MinimumOSVersion -string "16.0" Payload/FreeFireCompanion.app/Info.plist

          plutil -convert binary1 Payload/FreeFireCompanion.app/Info.plist

          zip -r FreeFireCompanion.ipa Payload

      - name: Commit IPA & Manifest to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FreeFireCompanion.ipa manifest.plist || true
          git commit -m "Auto-update compiled IPA for 1-click OTA install" || true
          git push || true

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Free Fire Companion iOS v1.0.${{ github.run_number }}
          body: |
            📲 **1-Click Direct Wireless iPhone Install Link:**
            [itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/AKKi-bio/FreeFireCompanion/main/manifest.plist](itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/AKKi-bio/FreeFireCompanion/main/manifest.plist)
          files: |
            FreeFireCompanion.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
