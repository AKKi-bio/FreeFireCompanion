name: Free iOS App Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build iOS App
        run: |
          mkdir -p build
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -emit-executable \
            -o build/FreeFireCompanion \
            FreeFireCompanionApp.swift \
            ContentView.swift \
            Models/DeviceProfile.swift \
            Views/SensitivityView.swift \
            Views/TouchTestView.swift \
            Views/PerformanceGuideView.swift \
            Views/PingTestView.swift

      - name: Create Payload & IPA
        run: |
          mkdir -p Payload/FreeFireCompanion.app
          cp build/FreeFireCompanion Payload/FreeFireCompanion.app/
          
          cat << 'EOF' > Payload/FreeFireCompanion.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FreeFireCompanion</string>
              <key>CFBundleIdentifier</key>
              <string>com.freefire.companion</string>
              <key>CFBundleName</key>
              <string>FF Companion</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIMainStoryboardFile</key>
              <string></string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          zip -r FreeFireCompanion.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: FreeFireCompanion-iOS-App
          path: FreeFireCompanion.ipa
